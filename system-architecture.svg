<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">StepBy 現在のシステム構成</title>
  <desc id="desc">利用者端末、GitHub Pages、Google認証、OpenStreetMap、Google Cloud開発環境、ローカル現行環境の接続を示す構成図。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#0f9f8f"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#e07a22"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#18212d}
      .title{font-size:34px;font-weight:800}.subtitle{font-size:15px;fill:#64748b}.section{font-size:21px;font-weight:800}.boxTitle{font-size:22px;font-weight:800}.body{font-size:15px}.small{font-size:13px;fill:#536173}.tiny{font-size:12px;fill:#64748b}.label{font-size:12px;font-weight:700;fill:#334155}
      .card{fill:#fff;stroke:#667085;stroke-width:1.6}.cloud{fill:#edfdf9;stroke:#0f9f8f;stroke-width:2.4}.legacy{fill:#f8fafc;stroke:#64748b;stroke-width:2.2}.external{fill:#fff8ed;stroke:#e07a22;stroke-width:1.8}.db{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:1.8}.inner{fill:#fff;stroke:#9aa8b8;stroke-width:1.3}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.lineGreen{fill:none;stroke:#0f9f8f;stroke-width:3;marker-end:url(#arrowGreen)}.lineOrange{fill:none;stroke:#e07a22;stroke-width:2.7;marker-end:url(#arrowOrange)}.dash{stroke-dasharray:7 6}.pill{fill:#dcfce7;stroke:#22c55e}.legacyPill{fill:#e2e8f0;stroke:#94a3b8}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text x="55" y="55" class="title">StepBy 現在のシステム構成</text>
  <text x="55" y="83" class="subtitle">2026年8月15日時点　緑＝UI10・クラウド開発版　灰＝UI0・ローカル現行版　橙＝外部サービス</text>

  <!-- top services -->
  <rect x="55" y="125" width="300" height="130" rx="20" class="card" filter="url(#shadow)"/>
  <text x="205" y="173" text-anchor="middle" class="boxTitle">GitHub Pages</text>
  <text x="205" y="202" text-anchor="middle" class="body">フロントエンド配信</text>
  <text x="205" y="226" text-anchor="middle" class="small">UI10（開発版）／UI0（現行版）</text>

  <rect x="650" y="105" width="300" height="190" rx="34" class="card" filter="url(#shadow)"/>
  <rect x="745" y="118" width="110" height="18" rx="9" fill="#374151"/><circle cx="800" cy="127" r="5" fill="#050505"/>
  <text x="800" y="169" text-anchor="middle" class="boxTitle">利用者端末</text>
  <text x="800" y="196" text-anchor="middle" class="body">スマートフォン／PC</text>
  <text x="800" y="222" text-anchor="middle" class="small">画面表示・GPS生座標取得</text>
  <text x="800" y="244" text-anchor="middle" class="small">1km OSMデータでブラウザフィット</text>
  <text x="800" y="266" text-anchor="middle" class="small">送信待ちキュー・オフライン再送</text>

  <rect x="1050" y="125" width="235" height="130" rx="20" class="external" filter="url(#shadow)"/>
  <text x="1167" y="169" text-anchor="middle" class="boxTitle">Google Identity</text>
  <text x="1167" y="198" text-anchor="middle" class="body">StepByログイン</text>
  <text x="1167" y="224" text-anchor="middle" class="small">OpenID Connect</text>

  <rect x="1325" y="125" width="220" height="130" rx="20" class="external" filter="url(#shadow)"/>
  <text x="1435" y="169" text-anchor="middle" class="boxTitle">OpenStreetMap</text>
  <text x="1435" y="198" text-anchor="middle" class="body">地図・Way・点字データ</text>
  <text x="1435" y="224" text-anchor="middle" class="small">OAuth／Changeset／Overpass</text>

  <path d="M355 190H650" class="line"/><path d="M950 180h100" class="lineOrange"/><path d="M950 230c170 55 260 55 375 0" class="lineOrange"/>
  <text x="500" y="178" text-anchor="middle" class="label">HTML・CSS・JavaScript</text>
  <text x="1000" y="168" text-anchor="middle" class="label">認証</text>

  <!-- cloud current development -->
  <rect x="405" y="345" width="1140" height="555" rx="24" class="cloud" filter="url(#shadow)"/>
  <text x="435" y="382" class="section">Google Cloud 開発環境（現在のUI10接続先）</text>
  <rect x="1248" y="359" width="265" height="34" rx="17" class="pill"/><text x="1380" y="381" text-anchor="middle" class="label">Valhalla依存なし・稼働中</text>
  <text x="435" y="408" class="small">Compute Engine: stepby-dev-1／固定IP／us-west1　公開HTTPS: stepby-api-8-229-191-182.sslip.io</text>

  <rect x="445" y="445" width="240" height="105" rx="18" class="inner"/>
  <text x="565" y="480" text-anchor="middle" class="boxTitle">Caddy</text><text x="565" y="508" text-anchor="middle" class="body">HTTPS・TLS</text><text x="565" y="532" text-anchor="middle" class="small">公開443 → localhost:3100</text>

  <rect x="745" y="435" width="455" height="265" rx="20" class="inner"/>
  <text x="972" y="473" text-anchor="middle" class="boxTitle">Node.js バックエンド</text>
  <text x="972" y="498" text-anchor="middle" class="small">systemd: stepby-dev.service／devブランチ</text>
  <rect x="775" y="522" width="190" height="68" rx="12" fill="#f0fdfa" stroke="#5eead4"/><text x="870" y="548" text-anchor="middle" class="body">認証・プロフィール</text><text x="870" y="570" text-anchor="middle" class="small">Google／OSM OAuth</text>
  <rect x="980" y="522" width="190" height="68" rx="12" fill="#f0fdfa" stroke="#5eead4"/><text x="1075" y="548" text-anchor="middle" class="body">記録・タグAPI</text><text x="1075" y="570" text-anchor="middle" class="small">raw・PRO・道情報</text>
  <rect x="775" y="606" width="190" height="68" rx="12" fill="#f0fdfa" stroke="#5eead4"/><text x="870" y="632" text-anchor="middle" class="body">OSM変更API</text><text x="870" y="654" text-anchor="middle" class="small">分割・公開・取消し</text>
  <rect x="980" y="606" width="190" height="68" rx="12" fill="#f0fdfa" stroke="#5eead4"/><text x="1075" y="632" text-anchor="middle" class="body">安全・管理API</text><text x="1075" y="654" text-anchor="middle" class="small">監査・競合停止・冪等</text>

  <rect x="1255" y="445" width="250" height="145" rx="18" class="db"/>
  <text x="1380" y="480" text-anchor="middle" class="boxTitle">PostgreSQL 16</text>
  <text x="1380" y="508" text-anchor="middle" class="body">stepby_app_dev</text>
  <text x="1380" y="532" text-anchor="middle" class="small">記録・GPS raw・Way座標</text>
  <text x="1380" y="554" text-anchor="middle" class="small">タグ・OSMリンク・追記監査</text>
  <text x="1380" y="576" text-anchor="middle" class="tiny">開発専用DB／現行DBと分離</text>

  <rect x="445" y="625" width="240" height="105" rx="18" class="external"/>
  <text x="565" y="660" text-anchor="middle" class="boxTitle">Secret Manager</text><text x="565" y="687" text-anchor="middle" class="body">認証・暗号鍵を保管</text><text x="565" y="711" text-anchor="middle" class="small">VMサービスアカウントだけ読取</text>
  <rect x="445" y="755" width="240" height="105" rx="18" class="external"/>
  <text x="565" y="790" text-anchor="middle" class="boxTitle">Cloud Storage</text><text x="565" y="817" text-anchor="middle" class="body">日次バックアップ</text><text x="565" y="841" text-anchor="middle" class="small">DB＋uploads／30日保持</text>
  <rect x="745" y="735" width="455" height="125" rx="18" class="inner"/>
  <text x="972" y="770" text-anchor="middle" class="boxTitle">OSMデータ処理</text><text x="972" y="798" text-anchor="middle" class="body">公式OSM／Overpassから読取</text><text x="972" y="823" text-anchor="middle" class="small">端末で連続Way経路を確定・左右を自動判定</text><text x="972" y="846" text-anchor="middle" class="small">本人の保存・削除確定時だけ本番OSMへ送信</text>
  <rect x="1255" y="625" width="250" height="105" rx="18" class="inner"/>
  <text x="1380" y="660" text-anchor="middle" class="boxTitle">監視・管理画面</text><text x="1380" y="687" text-anchor="middle" class="body">稼働・容量・API履歴</text><text x="1380" y="711" text-anchor="middle" class="small">秘密情報は表示しない</text>

  <path d="M685 497h60" class="lineGreen"/><path d="M1200 517h55" class="lineGreen"/><path d="M685 677c35 0 35-90 60-90" class="lineOrange"/><path d="M745 680c-35 30-35 127-60 127" class="lineOrange"/><path d="M1200 647h55" class="lineGreen"/>
  <path d="M800 295v25H390v177h55" class="lineGreen"/><text x="560" y="310" class="label">UI10 API通信</text>
  <path d="M1160 435c0-90 225-80 225-180" class="lineOrange"/><text x="1275" y="332" class="label">読取／OAuth／OSM編集</text>

  <!-- legacy environment -->
  <rect x="55" y="345" width="305" height="555" rx="24" class="legacy" filter="url(#shadow)"/>
  <text x="80" y="382" class="section">ローカル現行環境</text>
  <rect x="80" y="402" width="255" height="32" rx="16" class="legacyPill"/><text x="207" y="423" text-anchor="middle" class="label">UI0を止めずに並行稼働</text>
  <rect x="80" y="460" width="255" height="82" rx="15" class="inner"/><text x="207" y="490" text-anchor="middle" class="boxTitle">Tailscale Funnel</text><text x="207" y="518" text-anchor="middle" class="small">公開HTTPS・トンネリング</text>
  <rect x="80" y="565" width="255" height="110" rx="15" class="inner"/><text x="207" y="598" text-anchor="middle" class="boxTitle">Node.js API</text><text x="207" y="626" text-anchor="middle" class="body">main／PM2／:3000</text><text x="207" y="651" text-anchor="middle" class="small">現行の認証・記録・集計</text>
  <rect x="80" y="700" width="120" height="110" rx="15" class="inner"/><text x="140" y="735" text-anchor="middle" class="boxTitle">Valhalla</text><text x="140" y="763" text-anchor="middle" class="body">:8002</text><text x="140" y="786" text-anchor="middle" class="small">UI0 fitting</text>
  <rect x="215" y="700" width="120" height="110" rx="15" class="db"/><text x="275" y="735" text-anchor="middle" class="boxTitle">PostgreSQL</text><text x="275" y="763" text-anchor="middle" class="small">現行DB</text><text x="275" y="786" text-anchor="middle" class="small">クラウドと分離</text>
  <path d="M207 542v23" class="line"/><path d="M180 675l-25 25" class="line"/><path d="M235 675l25 25" class="line"/>
  <path d="M205 255v145" class="line dash"/><text x="215" y="326" class="label">UI0</text>

  <text x="55" y="952" class="small">重要：UI10の通常フィッティングは端末内で行い、クラウドAPIは記録・認証・OSM変更・DB保存を担当。UI0のValhallaと現行DBは停止・変更していない。</text>
  <text x="1545" y="978" text-anchor="end" class="tiny">構成変更時はこのSVGとタスクリストを同時更新する</text>
</svg>
