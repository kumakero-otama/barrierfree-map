<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">StepBy 現在のシステム構成</title>
  <desc id="desc">開発版StepBy UI10とUI11の利用者端末、GitHub Pages、Google認証、Gmail通知、国土地理院航空写真、OpenStreetMap、Google Cloud、Node API、PostgreSQL審査キューの接続を示す構成図。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#0f9f8f"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#e07a22"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#18212d}
      .title{font-size:34px;font-weight:800}.subtitle{font-size:15px;fill:#64748b}.section{font-size:21px;font-weight:800}.boxTitle{font-size:22px;font-weight:800}.body{font-size:15px}.small{font-size:13px;fill:#536173}.tiny{font-size:12px;fill:#64748b}.label{font-size:12px;font-weight:700;fill:#334155}
      .card{fill:#fff;stroke:#667085;stroke-width:1.6}.cloud{fill:#edfdf9;stroke:#0f9f8f;stroke-width:2.4}.external{fill:#fff8ed;stroke:#e07a22;stroke-width:1.8}.db{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:1.8}.inner{fill:#fff;stroke:#9aa8b8;stroke-width:1.3}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.lineGreen{fill:none;stroke:#0f9f8f;stroke-width:3;marker-end:url(#arrowGreen)}.lineOrange{fill:none;stroke:#e07a22;stroke-width:2.7;marker-end:url(#arrowOrange)}.pill{fill:#dcfce7;stroke:#22c55e}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text x="55" y="55" class="title">StepBy 現在のシステム構成</text>
  <text x="55" y="83" class="subtitle">2026年8月25日時点　UI11でOSM公開前の管理者審査・メール通知を実装　緑＝StepBy／Google Cloud　橙＝外部サービス</text>

  <!-- top services -->
  <rect x="55" y="125" width="300" height="130" rx="20" class="card" filter="url(#shadow)"/>
  <text x="205" y="173" text-anchor="middle" class="boxTitle">GitHub Pages</text>
  <text x="205" y="202" text-anchor="middle" class="body">フロントエンド配信</text>
  <text x="205" y="226" text-anchor="middle" class="small">UI10・UI11公開中</text>

  <rect x="650" y="105" width="300" height="190" rx="34" class="card" filter="url(#shadow)"/>
  <rect x="745" y="118" width="110" height="18" rx="9" fill="#374151"/><circle cx="800" cy="127" r="5" fill="#050505"/>
  <text x="800" y="169" text-anchor="middle" class="boxTitle">利用者端末</text>
  <text x="800" y="196" text-anchor="middle" class="body">スマートフォン／PC</text>
  <text x="800" y="222" text-anchor="middle" class="small">画面表示・GPS生座標取得</text>
  <text x="800" y="244" text-anchor="middle" class="small">1km OSMデータでブラウザフィット</text>
  <text x="800" y="266" text-anchor="middle" class="small">保存直前に最新Way取得・OSM審査待ちへ登録</text>

  <rect x="1050" y="125" width="235" height="130" rx="20" class="external" filter="url(#shadow)"/>
  <text x="1167" y="169" text-anchor="middle" class="boxTitle">Google Identity</text>
  <text x="1167" y="198" text-anchor="middle" class="body">StepByログイン</text>
  <text x="1167" y="224" text-anchor="middle" class="small">OpenID Connect／管理者照合／StepBy専用Gmail通知</text>

  <rect x="1325" y="125" width="220" height="130" rx="20" class="external" filter="url(#shadow)"/>
  <text x="1435" y="169" text-anchor="middle" class="boxTitle">OpenStreetMap</text>
  <text x="1435" y="198" text-anchor="middle" class="body">地図・Way・点字データ</text>
  <text x="1435" y="224" text-anchor="middle" class="small">StepBy専用アカウント／Changeset／Overpass</text>

  <path d="M355 190H650" class="line"/><path d="M950 180h100" class="lineOrange"/><path d="M950 230c170 55 260 55 375 0" class="lineOrange"/>
  <text x="500" y="178" text-anchor="middle" class="label">HTML・CSS・JavaScript</text>
  <text x="1000" y="168" text-anchor="middle" class="label">認証</text>

  <!-- cloud current development -->
  <rect x="55" y="345" width="1490" height="555" rx="24" class="cloud" filter="url(#shadow)"/>
  <text x="85" y="382" class="section">Google Cloud 開発環境（UI10・UI11接続）</text>
  <rect x="1248" y="359" width="265" height="34" rx="17" class="pill"/><text x="1380" y="381" text-anchor="middle" class="label">ブラウザフィッティング・稼働中</text>
  <text x="85" y="408" class="small">Compute Engine: stepby-dev-1／固定IP／us-west1　公開HTTPS: stepby-api-8-229-191-182.sslip.io</text>

  <rect x="95" y="445" width="240" height="105" rx="18" class="inner"/>
  <text x="215" y="480" text-anchor="middle" class="boxTitle">Caddy</text><text x="215" y="508" text-anchor="middle" class="body">HTTPS・TLS</text><text x="215" y="532" text-anchor="middle" class="small">公開443 → localhost:3100</text>

  <rect x="395" y="435" width="555" height="265" rx="20" class="inner"/>
  <text x="672" y="473" text-anchor="middle" class="boxTitle">Node.js バックエンド</text>
  <text x="672" y="498" text-anchor="middle" class="small">systemd: stepby-dev.service／devブランチ</text>
  <rect x="425" y="522" width="240" height="68" rx="12" fill="#f0fdfa" stroke="#5eead4"/><text x="545" y="548" text-anchor="middle" class="body">認証・プロフィール</text><text x="545" y="570" text-anchor="middle" class="small">利用者はGoogle認証のみ</text>
  <rect x="680" y="522" width="240" height="68" rx="12" fill="#f0fdfa" stroke="#5eead4"/><text x="800" y="548" text-anchor="middle" class="body">記録・タグAPI</text><text x="800" y="570" text-anchor="middle" class="small">raw・PRO・道情報</text>
  <rect x="425" y="606" width="240" height="68" rx="12" fill="#f0fdfa" stroke="#5eead4"/><text x="545" y="632" text-anchor="middle" class="body">OSM変更API</text><text x="545" y="654" text-anchor="middle" class="small">分割・公開・取消し</text>
  <rect x="680" y="606" width="240" height="68" rx="12" fill="#f0fdfa" stroke="#5eead4"/><text x="800" y="632" text-anchor="middle" class="body">審査・安全API</text><text x="800" y="654" text-anchor="middle" class="small">承認・保留・却下・監査・競合停止</text>

  <rect x="1010" y="445" width="300" height="145" rx="18" class="db"/>
  <text x="1160" y="480" text-anchor="middle" class="boxTitle">PostgreSQL 16</text>
  <text x="1160" y="508" text-anchor="middle" class="body">stepby_app_dev</text>
  <text x="1160" y="532" text-anchor="middle" class="small">記録・GPS raw・Way座標</text>
  <text x="1160" y="554" text-anchor="middle" class="small">審査キュー・公開／本人限定タグ・追記監査</text>
  <text x="1160" y="576" text-anchor="middle" class="tiny">UI10専用DB</text>

  <rect x="95" y="625" width="240" height="105" rx="18" class="external"/>
  <text x="215" y="660" text-anchor="middle" class="boxTitle">Secret Manager</text><text x="215" y="687" text-anchor="middle" class="body">OAuth・SMTP秘密情報</text><text x="215" y="711" text-anchor="middle" class="small">専用OSMトークンはDB内で暗号化</text>
  <rect x="95" y="755" width="240" height="105" rx="18" class="external"/>
  <text x="215" y="790" text-anchor="middle" class="boxTitle">Cloud Storage</text><text x="215" y="817" text-anchor="middle" class="body">日次バックアップ</text><text x="215" y="841" text-anchor="middle" class="small">DB＋uploads／30日保持</text>
  <rect x="395" y="735" width="555" height="125" rx="18" class="inner"/>
  <text x="672" y="770" text-anchor="middle" class="boxTitle">ブラウザフィッティング・公開審査</text><text x="672" y="798" text-anchor="middle" class="body">公式OSM／Overpass／国土地理院から読取</text><text x="672" y="823" text-anchor="middle" class="small">航空写真とOSMを並べ、新規＋旧328記録を1件ずつ確認</text><text x="672" y="846" text-anchor="middle" class="small">承認済み点字タグだけ送信・ゲストと本人限定情報はDBのみ</text>
  <rect x="1010" y="625" width="300" height="105" rx="18" class="inner"/>
  <text x="1160" y="660" text-anchor="middle" class="boxTitle">監視・管理画面</text><text x="1160" y="687" text-anchor="middle" class="body">稼働・容量・審査・API履歴</text><text x="1160" y="711" text-anchor="middle" class="small">kumakero.otama@gmail.com のみ審査可</text>

  <path d="M335 497h60" class="lineGreen"/><path d="M950 517h60" class="lineGreen"/><path d="M335 677c35 0 35-90 60-90" class="lineOrange"/><path d="M395 680c-35 30-35 127-60 127" class="lineOrange"/><path d="M950 647h60" class="lineGreen"/>
  <path d="M800 295v25H40v177h55" class="lineGreen"/><text x="470" y="310" class="label">UI10・UI11稼働</text>
  <path d="M910 435c0-90 475-80 475-180" class="lineOrange"/><text x="1190" y="332" class="label">読取／専用トークン／OSM編集</text>

  <text x="55" y="952" class="small">UI11の保存はDBと審査待ち登録まで。Google利用者の承認済み記録だけを専用OSMアカウントで送り、ゲスト記録は送らない。</text>
  <text x="1545" y="978" text-anchor="end" class="tiny">構成変更時はこのSVGとタスクリストを同時更新する</text>
</svg>
