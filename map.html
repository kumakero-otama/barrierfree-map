<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draggable Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="map.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Draggable Map</h1>
      <div class="map-row">
        <div id="map" aria-label="Map"></div>
        <aside class="map-side">
          <div class="meta">
            <div id="last-updated">Last update: --:--:--</div>
            <div id="match-count">Match calls: 0</div>
            <button id="reload-location" class="btn" type="button">Reload location</button>
            <button id="toggle-fit" class="btn" type="button">Fitting: ON</button>
          </div>
        </aside>
      </div>
      <p id="coords">Lat: --, Lng: --</p>
      <p id="raw-coords">Raw: --, --</p>
      <p id="snapped-coords">Snapped: --, --</p>
      <p><a class="btn" href="index.html">Back</a></p>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="map.js"></script>
  </body>
</html>
