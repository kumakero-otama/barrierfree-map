  /auth/osm/status:
    get:
      summary: StepBy専用OSMアカウントによる公開準備状態を取得
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: editorMode=stepby_service_account と設定状態 }
        '401': { description: authentication_required }
  /api/osm-walkable-network:
    get:
      summary: ブラウザフィッティング用の1km OSM道路網を取得
      description: 記録保存直前は forceRefresh=1 によりブラウザ・API双方のキャッシュを回避する。
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: centerLat, required: true, schema: { type: number } }
        - { in: query, name: centerLng, required: true, schema: { type: number } }
        - { in: query, name: radiusMeters, schema: { type: integer, maximum: 1500, default: 1000 } }
        - { in: query, name: forceRefresh, schema: { type: integer, enum: [0, 1], default: 0 } }
      responses:
        '200': { description: 現在のWay・Node・Relation }
  /api/osm/split-plan:
    post:
      summary: 所有記録のWay分割・点字タグ変更案を追記保存
      description: 公開対象タグだけを扱い、柵・塀・グレーチング・メモは含めない。
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: 変更案作成 }
        '409': { description: 所有者不一致、非公開記録、既存点字タグなど }
  /api/osm/records/{recordId}/publish:
    post:
      summary: 保存確認済みの1記録をStepBy専用OSMアカウントから送信
      description: authorization=record_save、追記監査、冪等性、最新Version一致を必須とする。
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: recordId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 送信成功または冪等な既存結果 }
        '409': { description: 許可不足またはVersion競合 }
        '423': { description: OSM書込み安全条件未成立 }
  /api/osm/records/{recordId}/revert:
    post:
      summary: 本人の緑線削除確認に対応する反対changesetを送信
      description: authorization=owned_green_line_delete。元履歴は削除せず追記する。
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: recordId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 取消し成功または冪等な既存結果 }
        '409': { description: 所有者不一致またはVersion競合 }
        '423': { description: OSM書込み安全条件未成立 }

  /api/osm/reviews:
    get:
      summary: OSM公開前の審査一覧
      description: Google認証メールが管理者許可リストと一致する場合だけ利用できます。
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, held, approved, rejected, merge_failed, merged, all] }
        - { in: query, name: source, schema: { type: string, enum: [new_record, legacy_record, all] } }
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: 審査一覧、GPS生座標、経路、OSM変更案 }
        '403': { description: review_admin_required }
  /api/osm/reviews/{reviewId}/approve:
    post:
      summary: 審査記録を承認し、安全条件が揃う場合だけOSMへ送信
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 承認結果。機能ロック中はexecutionDeferred=true }
        '409': { description: 競合または承認不能状態 }
  /api/osm/reviews/{reviewId}/reject:
    post:
      summary: 審査記録を理由付きで却下
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 却下済み。OSM送信なし }
  /api/osm/reviews/{reviewId}/reopen:
    post:
      summary: 却下記録を確認待ちへ戻す
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 確認待ちへ復帰 }
  /api/osm/reviews/{reviewId}/hold:
    post:
      summary: 管理者メモとともに審査を保留
      parameters:
        - { in: path, name: reviewId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 保留済み。OSM送信なし }
  /api/osm/reviews/{reviewId}/memo:
    post:
      summary: 審査状態を変えず管理者メモを保存
      parameters:
        - { in: path, name: reviewId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: メモ保存済み }
  /api/osm/reviews/{reviewId}/retry-notification:
    post:
      summary: 指定記録の管理者通知を再送
      parameters:
        - { in: path, name: reviewId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 通知送信成功 }
        '502': { description: 通知送信失敗。記録保存には影響しない }
  /api/osm/review-notifications/retry:
    post:
      summary: 失敗・未送信の審査通知を再試行
      responses:
        '200': { description: 再試行件数と成功件数 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: session

  responses:
    BadRequest:
      description: リクエスト不正
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 認証エラー
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    MethodNotAllowed:
      description: method_not_allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: サーバー内部エラー
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorWithMessage' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }

    ErrorWithMessage:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            message: { type: string }

    SessionSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        sessionId: { type: string }

    StatsResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        targetDate:
          type: string
          format: date
          example: '2026-05-03'
        totalUsers: { type: integer, example: 123 }
        totalTactileLengthMeters: { type: integer, example: 456789 }
        totalRoadInfoPosts: { type: integer, example: 321 }

    PostTag:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        dbId: { type: integer }
        sortOrder: { type: integer }

    PostTagWriteResult:
      type: object
      properties:
        success: { type: boolean }
        created: { type: boolean }
        tag: { $ref: '#/components/schemas/PostTag' }
        count: { type: integer }

    RoadInfoListResponse:
      type: object
      properties:
        success: { type: boolean }
        count: { type: integer }
        points:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              lat: { type: number }
              lng: { type: number }
              createdBy: { type: integer, nullable: true }

    RoadInfoDetailResponse:
      type: object
      properties:
        success: { type: boolean }
        point:
          type: object
          properties:
            id: { type: integer }
            lat: { type: number }
            lng: { type: number }
            status: { type: string }
            createdAt: { type: string, format: date-time }
            tags:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  code: { type: string }
                  labelJa: { type: string }
            posts:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  body: { type: string }
                  createdAt: { type: string, format: date-time }
                  createdBy: { type: integer, nullable: true }
                  authorUsername: { type: string, nullable: true }
                  authorIconUrl: { type: string, nullable: true }
                  media:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        mediaType: { type: string }
                        url: { type: string }
                        createdAt: { type: string, format: date-time }

    AuthUser:
      type: object
      properties:
        userId: { type: integer }
        email: { type: string, nullable: true }
        username: { type: string, nullable: true }
        iconUrl: { type: string, nullable: true }
        totalTactileLength: { type: number }
        totalRoadPosts: { type: integer }
        totalHearts: { type: integer }
        isGuest: { type: boolean, example: false }

    ProStatusResponse:
      type: object
      properties:
        userId: { type: integer }
        isPro: { type: boolean }

    TactileTag:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        labelJa: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }

    SessionTag:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        tagId: { type: integer }
        tagCode: { type: string, nullable: true }
        tagLabelJa: { type: string, nullable: true }
        sortOrder: { type: integer, nullable: true }
        isActive: { type: boolean, nullable: true }

    TactileRankingItem:
      type: object
      properties:
        userId: { type: integer }
        username: { type: string, nullable: true }
        rank: { type: integer }
        iconUrl: { type: string, nullable: true }
        distanceMeters: { type: integer }

    TactileRankingResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        periodDays: { type: integer, example: 7 }
        limit: { type: integer, example: 10 }
        count: { type: integer, example: 10 }
        ranking:
          type: array
          items: { $ref: '#/components/schemas/TactileRankingItem' }

    TactileSessionInfo:
      type: object
      properties:
        sessionId: { type: string, format: uuid }
        username: { type: string, nullable: true }
        iconUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        memo: { type: string }
        tags:
          type: array
          items: { type: string }

    AuthSuccessResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer }
        user: { $ref: '#/components/schemas/AuthUser' }
