openapi: 3.0.3
info:
  title: Barrierfree Map API
  version: 1.27.2
  description: |
    barrierfree-map の実装（`server.js` と `server/api/*.js`）に基づく API 仕様。
    一部レスポンスは上流サービス（Valhalla / Overpass）の返却を透過的に返すため、
    フィールドが追加される場合があります。
servers:
  - url: http://localhost:3000
    description: Local HTTP
  - url: https://localhost:3001
    description: Local HTTPS

tags:
  - name: Match
  - name: Session
  - name: Config
  - name: Records
  - name: Trace
  - name: OSM
  - name: RoadInfo
  - name: PostTags
  - name: Auth
  - name: ProStatus
  - name: Tactile
  - name: ClientLogs

paths:
  /api/config:
    get:
      tags: [Config]
      summary: クライアント初期化用設定を取得
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverMinIntervalMs: { type: integer }
                  clientMinIntervalMs: { type: integer }
                  roadInfoImageMaxBytes: { type: integer }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/count:
    get:
      tags: [Match]
      summary: マップマッチング月次カウントを取得
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  max: { type: integer }
                  month:
                    type: string
                    example: '2026-03'
                  allMonths:
                    type: object
                    additionalProperties:
                      type: integer
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/stats:
    get:
      tags: [Config]
      summary: 指定日までの総ユーザー数・総点字ブロック記録距離・総道情報件数を取得
      description: |
        指定日の終了時点までに作成・記録されたデータを集計します。
        総ユーザー数は `login.users.is_active = true` かつ `created_at` が指定日以前の件数です。
        総点字ブロック記録距離は `tactile.sessions.started_at` が指定日以前、かつ
        `tactile.sessions.is_active = true` と `login.users.is_active = true` の記録をメートル単位で合計します。
        総道情報件数は `roadinfo.road_info_point.status IN ('active', 'hidden')` かつ
        `created_at` が指定日以前の件数です。
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
            example: '2026-05-03'
          description: 集計対象日。未指定時は今日
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '400':
          description: invalid_date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: database_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/match:
    get:
      tags: [Match]
      summary: 旧Valhalla 1点マップマッチング（診断互換用）
      description: 正式UI0の通常記録フローでは使用しません。
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number, format: double }
        - in: query
          name: lng
          required: true
          schema: { type: number, format: double }
        - in: query
          name: prevLat
          schema: { type: number, format: double }
        - in: query
          name: prevLng
          schema: { type: number, format: double }
        - in: query
          name: sessionId
          schema: { type: string }
          description: sessionUuid でも指定可能
        - in: query
          name: sessionUuid
          schema: { type: string }
        - in: query
          name: userId
          schema: { type: string }
        - in: query
          name: deviceUuid
          schema: { type: string }
        - in: query
          name: seq
          schema: { type: integer }
        - in: query
          name: record
          schema: { type: string, enum: ['1'] }
          description: 1 の場合 realtime 記録を試行
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [lat, lng, count, month]
                properties:
                  lat: { type: number, format: double }
                  lng: { type: number, format: double }
                  count: { type: integer }
                  month: { type: string }
        '204':
          description: 上限到達または上流応答を処理できない場合
        '400':
          description: invalid_coordinates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: rate_limited
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: rate_limited
                  retryAfterMs:
                    type: integer
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/session/start:
    post:
      tags: [Session]
      summary: セッション開始
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                sessionUuid: { type: string }
                startedAt: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionSuccess'
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      sessionId: { type: string }
                      dbDisabled: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/session/point:
    post:
      tags: [Session]
      summary: 画面遷移中のGPS生座標を追記
      description: 道情報投稿画面などで記録を継続するため、生座標だけを保存します。フィッティングは正式UI0へ戻った後にブラウザ内JavaScriptで行います。
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, lat, lng]
              properties:
                sessionId: { type: string }
                lat: { type: number, format: double, minimum: -90, maximum: 90 }
                lng: { type: number, format: double, minimum: -180, maximum: 180 }
                accuracy: { type: number, format: double, minimum: 0, nullable: true }
                recordedAt: { type: string, format: date-time }
      responses:
        '200':
          description: GPS生座標を保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSuccess' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: session_not_found_or_forbidden
        '409':
          description: session_canceled
        '500':
          $ref: '#/components/responses/InternalError'

  /api/session/end:
    post:
      tags: [Session]
      summary: セッション終了
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                sessionUuid: { type: string }
                endedAt: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      sessionId: { type: string }
                      updated: { type: integer }
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      sessionId: { type: string }
                      dbDisabled: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/session/cancel:
    post:
      tags: [Session]
      summary: セッション関連データを削除
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                sessionUuid: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      sessionId: { type: string }
                      canceled: { type: boolean, example: true }
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      sessionId: { type: string }
                      dbDisabled: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: session_not_found_or_forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/session/deactivate:
    post:
      tags: [Session]
      summary: セッションを論理無効化
      description: |
        対象の `tactile.sessions.is_active` を `false` に更新します。
        関連データは削除しません。
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                sessionUuid: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      sessionId: { type: string }
                      updated: { type: integer, example: 1 }
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      sessionId: { type: string }
                      dbDisabled: { type: boolean, example: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: session_not_found_or_forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/session/memo:
    post:
      tags: [Session]
      summary: セッションメモを更新
      description: |
        対象の `tactile.sessions.memo` を、送信した文字列で上書き更新します。
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memo]
              properties:
                sessionId: { type: string }
                sessionUuid: { type: string }
                memo:
                  type: string
                  description: 保存するメモ文字列。空文字も指定可能
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      sessionId: { type: string }
                      memo: { type: string }
                      updated: { type: integer, example: 1 }
                  - type: object
                    properties:
                      success: { type: boolean, example: true }
                      sessionId: { type: string }
                      memo: { type: string }
                      dbDisabled: { type: boolean, example: true }
        '400':
          description: invalid_json / missing_session_id / missing_memo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: session_not_found_or_forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          $ref: '#/components/responses/InternalError'

  /api/records:
    get:
      tags: [Records]
      summary: 保存済み経路一覧を取得
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - in: query
          name: centerLat
          schema: { type: number, format: double }
        - in: query
          name: centerLng
          schema: { type: number, format: double }
        - in: query
          name: radiusKm
          schema: { type: number, format: double }
        - in: query
          name: mine
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  paths:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id: { type: string }
                        user_id: { type: integer, nullable: true }
                        source: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                        geom_geojson: { type: string }
                        tags:
                          type: array
                          items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: database_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/tactile-ranking:
    get:
      tags: [Tactile]
      summary: 指定期間の点字ブロック記録距離ランキングを取得
      description: |
        `tactile.sessions.started_at` を基準に指定日数内の記録を集計し、
        `tactile.session_paths.geom` の距離をメートル単位で合計して順位付けします。
        集計対象は `tactile.sessions.is_active = true` かつ `login.users.is_active = true` のデータのみです。
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 3650
            default: 7
          description: 今日から何日前までを集計対象にするか
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: 何位まで返すか
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TactileRankingResponse'
        '400':
          description: invalid_days / invalid_limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: database_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/trace:
    post:
      tags: [Trace]
      summary: ブラウザ確定経路の保存（旧Valhalla診断互換を含む）
      description: 正式UI0は source=browser と osmPreview を送り、生座標・フィット結果・Way列を保存します。osmPreviewがない旧診断リクエストだけValhallaを使用します。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shape]
              properties:
                userId: { type: string }
                sessionId: { type: string }
                source:
                  type: string
                  default: valhalla
                  enum: [browser, valhalla]
                costing:
                  type: string
                  default: pedestrian
                shape_match:
                  type: string
                  default: map_snap
                filters:
                  type: object
                  additionalProperties: true
                shape:
                  type: array
                  items:
                    type: object
                    required: [lat, lon]
                    properties:
                      lat: { type: number }
                      lon: { type: number }
                      type: { type: string }
      responses:
        '200':
          description: 保存結果または旧Valhalla診断レスポンス
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: invalid_json
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/osm-tactile-ways:
    get:
      tags: [OSM]
      summary: Overpass経由で点字ブロック関連地物を取得
      description: 公共Overpassミラーを失敗時だけ順次試行し、各30秒待機します。同一地域の成功結果は30分、障害時利用は24時間までキャッシュします。
      parameters:
        - in: query
          name: centerLat
          required: true
          schema: { type: number, format: double }
        - in: query
          name: centerLng
          required: true
          schema: { type: number, format: double }
        - in: query
          name: radiusKm
          schema: { type: number, format: double, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  centerLat: { type: number }
                  centerLng: { type: number }
                  radiusKm: { type: number }
                  count: { type: integer }
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, example: Feature }
                        properties:
                          type: object
                          additionalProperties: true
                        geometry:
                          type: object
                          properties:
                            type: { type: string }
                            coordinates:
                              oneOf:
                                - type: array
                                  items: { type: number }
                                - type: array
                                  items:
                                    type: array
                                    items: { type: number }
        '400':
          description: invalid_center
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: osm_upstream_error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorWithMessage' }

  /api/post-tags:
    get:
      tags: [PostTags]
      summary: 投稿タグ一覧を取得
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  tags:
                    type: array
                    items: { $ref: '#/components/schemas/PostTag' }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: database_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      tags: [PostTags]
      summary: 投稿タグを追加
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        '200':
          description: 既存タグ（新規作成なし）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostTagWriteResult' }
        '201':
          description: 新規作成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostTagWriteResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: database_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/road-info:
    get:
      tags: [RoadInfo]
      summary: 道情報（一覧または詳細）
      description: |
        一覧取得モード（`pointId` 未指定）では `roadinfo.road_info_point.status = active` のポイントのみ返します。
        詳細取得モード（`pointId` 指定）でも `roadinfo.road_info_point.status = deleted` のポイントは返しません。
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - in: query
          name: pointId
          schema: { type: integer }
          description: 指定時は詳細取得モード
        - in: query
          name: centerLat
          schema: { type: number, format: double }
        - in: query
          name: centerLng
          schema: { type: number, format: double }
        - in: query
          name: radiusKm
          schema: { type: number, format: double, default: 10 }
        - in: query
          name: mine
          schema: { type: string, enum: ['1'] }
          description: 1 の場合ログインユーザー投稿のみ
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RoadInfoListResponse'
                  - $ref: '#/components/schemas/RoadInfoDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: not_found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: database_unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      tags: [RoadInfo]
      summary: 道情報を投稿（タグ自動作成対応）
      description: |
        投稿時の `tagIds` は以下のように処理されます。
        - 既存タグコードはそのまま利用
        - 未登録コードは `roadinfo.road_info_tag` に新規作成
        - 解決されたタグは `roadinfo.road_info_point_tag` に紐付け（重複は無視）
        - 完了タグ（code: `complete` / `completed` / `done` / `resolved` / `inactive` または label_ja: `完了`）が含まれる場合、対象ポイントの `roadinfo.road_info_point.status` は `inactive` に更新されます
        - `status = deleted` を指定した場合は、タグ解決・note追加・media追加を行わず、対象ポイントの `roadinfo.road_info_point.status` 更新だけを実行します
        また、投稿成功時に対象ポイントの `roadinfo.road_info_point.updated_at` を更新します。
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pointId:
                  type: integer
                  description: 既存ポイントに投稿する場合
                lat:
                  type: number
                  format: double
                lng:
                  type: number
                  format: double
                detail:
                  type: string
                tagIds:
                  type: array
                  description: タグコード配列。未登録コードは自動作成される
                  items: { type: string }
                status:
                  type: string
                  enum: [active, inactive, hidden, deleted]
                  description: 任意。指定時は対象ポイントのstatusを更新。`hidden` と `deleted` は完了タグより優先される。`deleted` 指定時は note/media/tag の追加を行わない
