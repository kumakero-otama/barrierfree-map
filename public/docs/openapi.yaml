  /api/client-logs/health:
    get:
      tags: [ClientLogs]
      summary: フロント側ログ受信APIの疎通確認
      description: |
        クライアント側のログ送信機構がサーバーまで到達できるかを確認します。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  serverRequestId: { type: string }
                  timestamp: { type: string, format: date-time }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/client-logs:
    post:
      tags: [ClientLogs]
      summary: フロント側で蓄積した通信ログをまとめて送信
      description: |
        認証前後どちらの状態でも送信できるログ受信APIです。
        受信ログは `logs/client_logs.csv` に保存され、`logId` の重複は
        サーバープロセス内メモリで最新 10000 件を上限に判定します。
        実装上の上限は、1リクエストあたり 256KB、`logs[]` は最大 200 件です。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client, session, logs]
              properties:
                client:
                  type: object
                  properties:
                    appVersion: { type: string }
                    userAgent: { type: string }
                    platform: { type: string }
                session:
                  type: object
                  properties:
                    requestId: { type: string }
                logs:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [logId, createdAt, event, category]
                    properties:
                      logId:
                        type: string
                        maxLength: 128
                      createdAt:
                        type: string
                        format: date-time
                      event:
                        type: string
                        maxLength: 128
                      category:
                        type: string
                        maxLength: 64
                      level:
                        type: string
                        enum: [debug, info, warn, error]
                      path:
                        type: string
                        maxLength: 256
                      method:
                        type: string
                        maxLength: 16
                      status:
                        type: integer
                        nullable: true
                      message:
                        type: string
                        maxLength: 500
                      meta:
                        type: object
                        additionalProperties: true
      responses:
        '200':
          description: すべて受理または重複扱い
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  serverRequestId: { type: string }
                  accepted:
                    type: array
                    items: { type: string }
                  duplicate:
                    type: array
                    items: { type: string }
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        logId: { type: string }
                        reason: { type: string }
        '207':
          description: 一部受理、一部拒否
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  serverRequestId: { type: string }
                  accepted:
                    type: array
                    items: { type: string }
                  duplicate:
                    type: array
                    items: { type: string }
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        logId: { type: string }
                        reason: { type: string }
        '400':
          description: invalid_payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      serverRequestId: { type: string }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: payload_too_large
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      serverRequestId: { type: string }

