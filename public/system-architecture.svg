<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">StepBy / barrierfree-map 現在のシステム構成</title>
  <desc id="desc">利用端末、GitHub Pages、Tailscale、ローカルサーバー内の本番・開発バックエンド、PostgreSQL、Valhalla、外部サービスの接続関係を示す図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f9ff"/><stop offset="1" stop-color="#eef8f4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#19324d" flood-opacity=".13"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#059669"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#16263a}
      .title{font-size:34px;font-weight:800}.subtitle{font-size:16px;fill:#516477}.section{font-size:20px;font-weight:800}.boxTitle{font-size:18px;font-weight:800}.body{font-size:14px}.small{font-size:12px;fill:#53677c}.tiny{font-size:11px;fill:#53677c}.white{fill:#fff}.prodText{fill:#1d4ed8}.devText{fill:#047857}.warnText{fill:#b45309}.muted{fill:#64748b}
      .outer{fill:#fff;stroke:#cbd5e1;stroke-width:2}.prod{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.dev{fill:#ecfdf5;stroke:#34d399;stroke-width:2}.db{fill:#f5f3ff;stroke:#a78bfa;stroke-width:2}.external{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.infra{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.locked{fill:#fff7ed;stroke:#f59e0b;stroke-width:2;stroke-dasharray:7 5}.lineProd{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}.lineDev{fill:none;stroke:#059669;stroke-width:3;marker-end:url(#arrowGreen)}.lineExt{fill:none;stroke:#d97706;stroke-width:2.5;marker-end:url(#arrowOrange)}.lineGray{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrowGray)}.dash{stroke-dasharray:8 6}.pill{rx:12;ry:12}
    </style>
  </defs>
  <rect width="1600" height="1320" fill="url(#bg)"/>
  <text x="60" y="58" class="title">StepBy / barrierfree-map 現在のシステム構成</text>
  <text x="60" y="88" class="subtitle">2026年8月4日時点　青＝公開版　緑＝開発版　橙＝外部サービス　破線＝制限・未稼働経路</text>

  <!-- clients and frontend -->
  <rect x="45" y="120" width="1510" height="215" rx="22" class="outer" filter="url(#shadow)"/>
  <text x="70" y="153" class="section">利用端末とフロントエンド</text>
  <rect x="75" y="175" width="245" height="120" rx="16" class="infra"/>
  <text x="98" y="207" class="boxTitle">利用者の端末</text><text x="98" y="233" class="body">スマートフォン / PCブラウザ</text><text x="98" y="256" class="small">GPS・画面操作・IndexedDB</text><text x="98" y="277" class="small">（開発版は周辺OSMデータも保持）</text>
  <rect x="390" y="175" width="385" height="120" rx="16" class="prod"/>
  <text x="414" y="205" class="boxTitle prodText">公開フロント UI0</text><text x="414" y="232" class="body">GitHub Pages / StepBy mainブランチ</text><text x="414" y="255" class="small">kumakero-otama.github.io/StepBy/UI0/</text><text x="414" y="277" class="small">API接続先：Tailscale Funnel 標準HTTPS</text>
  <rect x="845" y="175" width="650" height="120" rx="16" class="dev"/>
  <text x="870" y="205" class="boxTitle devText">開発フロント UI10</text><text x="870" y="231" class="body">StepBy dev（比較UI・OSM未送信プレビュー・OAuth連携画面）</text><text x="870" y="254" class="small">GitHub Pages版：kumakero-otama.github.io/StepBy/UI10/</text><text x="870" y="276" class="small">tailnet版：10001 → ローカル静的配信 3200（PM2: stepby-ui10-dev）</text>
  <path d="M320 220 H390" class="lineProd"/><path d="M320 265 C350 315 810 315 845 265" class="lineDev"/>

  <!-- tailscale -->
  <rect x="45" y="370" width="1510" height="155" rx="22" class="outer" filter="url(#shadow)"/>
  <text x="70" y="403" class="section">公開・トンネリング層：Tailscale Serve / Funnel</text>
  <rect x="75" y="425" width="400" height="70" rx="14" class="prod"/><text x="96" y="452" class="boxTitle prodText">Funnel :443</text><text x="96" y="477" class="small">公開URL → 本番バックエンド localhost:3000</text>
  <rect x="525" y="425" width="400" height="70" rx="14" class="dev"/><text x="546" y="452" class="boxTitle devText">Funnel :10000</text><text x="546" y="477" class="small">公開開発API → localhost:3100（認証・Origin・制限あり）</text>
  <rect x="975" y="425" width="400" height="70" rx="14" class="dev"/><text x="996" y="452" class="boxTitle devText">Serve :10001</text><text x="996" y="477" class="small">tailnet内限定 → UI10 localhost:3200</text>
  <rect x="1400" y="425" width="125" height="70" rx="14" class="infra"/><text x="1415" y="452" class="body">:8443</text><text x="1415" y="474" class="tiny">CCRT別系統</text>

  <!-- local server -->
  <rect x="45" y="560" width="1510" height="570" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="3" filter="url(#shadow)"/>
  <text x="70" y="596" class="section">ローカルLinuxサーバー「barrierfree-map」</text>
  <text x="70" y="620" class="small">本番と開発は同じ物理サーバー上。ただしGit worktree・ブランチ・PM2プロセス・ポート・DB・設定を分離。Nodeバックエンドは仮想環境ではなくPM2管理。</text>

  <rect x="75" y="650" width="445" height="290" rx="18" class="prod"/>
  <text x="98" y="682" class="boxTitle prodText">公開バックエンド</text><text x="98" y="707" class="body">/home/otama/barrierfree-map　main</text><text x="98" y="730" class="body">PM2: barrierfree-map-server　*:3000</text>
  <rect x="98" y="755" width="399" height="70" rx="12" fill="#fff" stroke="#93c5fd"/><text x="115" y="779" class="body">認証・プロフィール・記録・集計・タグ API</text><text x="115" y="802" class="small">Google認証 / session / records / stats / road info</text>
  <rect x="98" y="842" width="399" height="70" rx="12" fill="#fff" stroke="#93c5fd"/><text x="115" y="866" class="body">Valhallaフィッティング API</text><text x="115" y="889" class="small">/api/match・/api/trace → Valhalla :8002</text>

  <rect x="555" y="650" width="570" height="410" rx="18" class="dev"/>
  <text x="578" y="682" class="boxTitle devText">開発バックエンド</text><text x="578" y="707" class="body">/home/otama/barrierfree-map-dev　dev</text><text x="578" y="730" class="body">PM2: barrierfree-map-dev　127.0.0.1:3100</text>
  <rect x="578" y="755" width="524" height="68" rx="12" fill="#fff" stroke="#6ee7b7"/><text x="595" y="779" class="body">共通アプリAPI</text><text x="595" y="802" class="small">Google/Guest認証・OSM OAuth(PKCE)・プロフィール・記録・集計</text>
  <rect x="578" y="838" width="252" height="86" rx="12" fill="#fff" stroke="#6ee7b7"/><text x="595" y="864" class="body">フィッティング検証API</text><text x="595" y="886" class="small">Valhalla比較・詳細・履歴</text><text x="595" y="906" class="small">ブラウザ処理用周辺Way取得</text>
  <rect x="850" y="838" width="252" height="86" rx="12" class="locked"/><text x="867" y="864" class="body warnText">OSM変更API（ロック中）</text><text x="867" y="886" class="small">Relation継承・1記録1変更案</text><text x="867" y="906" class="small">record_id取消案 / 実送信OFF</text>
  <rect x="578" y="940" width="524" height="92" rx="12" fill="#fff" stroke="#6ee7b7"/><text x="595" y="966" class="body">安全機構</text><text x="595" y="988" class="small">署名トークン・Origin制限・レート制限・本文上限・管理者確認</text><text x="595" y="1009" class="small">OSM監査履歴は追記型。送信・取消しは明示許可がなければ実行不可</text>

  <rect x="1160" y="650" width="355" height="190" rx="18" class="db"/>
  <text x="1183" y="682" class="boxTitle">PostgreSQL 16</text><text x="1183" y="706" class="body">同じDBサーバープロセス　:5432</text>
  <rect x="1183" y="730" width="309" height="42" rx="10" fill="#fff" stroke="#818cf8"/><text x="1200" y="756" class="body prodText">公開DB：barrierfree_map</text>
  <rect x="1183" y="783" width="309" height="42" rx="10" fill="#fff" stroke="#34d399"/><text x="1200" y="809" class="body devText">開発DB：stepby_app_dev</text>
  <text x="1183" y="851" class="small">※構造は同系統、データは分離</text><text x="1183" y="870" class="tiny">開発DB：記録―変更案、暗号化OSM認可、追記監査履歴</text>

  <rect x="1160" y="885" width="355" height="175" rx="18" class="infra"/>
  <text x="1183" y="917" class="boxTitle">Docker / 同居サービス</text><text x="1183" y="944" class="body">Valhallaコンテナ　:8002</text><text x="1183" y="966" class="small">現行UI0のマップマッチングで使用</text><text x="1183" y="993" class="body">CCRTコンテナ　localhost:8080</text><text x="1183" y="1015" class="small">Funnel :8443（StepByとは別系統）</text><text x="1183" y="1042" class="small">Netdata等の運用コンテナも同居</text>

  <path d="M520 790 H1160" class="lineProd"/><path d="M1125 790 H1160" class="lineDev"/>
  <path d="M497 877 C700 1110 1030 1090 1160 950" class="lineProd"/>

  <!-- external -->
  <rect x="45" y="1165" width="1510" height="115" rx="22" class="outer" filter="url(#shadow)"/>
  <text x="70" y="1198" class="section">外部サービス</text>
  <rect x="75" y="1215" width="275" height="45" rx="12" class="external"/><text x="94" y="1243" class="body">Google Identity：StepByログイン</text>
  <rect x="375" y="1215" width="275" height="45" rx="12" class="external"/><text x="394" y="1243" class="body">GitHub：ソース / Pages配信</text>
  <rect x="675" y="1215" width="275" height="45" rx="12" class="external"/><text x="694" y="1243" class="body">Overpass API：周辺OSM読取</text>
  <rect x="975" y="1215" width="350" height="45" rx="12" class="external"/><text x="994" y="1243" class="body">OSM開発OAuth：Client ID設定済・小窓認証</text>
  <rect x="1350" y="1215" width="175" height="45" rx="12" class="external"/><text x="1369" y="1243" class="body">地図タイル等</text>
  <path d="M850 838 C850 1140 800 1140 800 1215" class="lineExt"/><path d="M976 924 C1080 1135 1150 1135 1150 1215" class="lineExt dash"/>

  <!-- flow arrows between layers -->
  <path d="M582 295 C582 355 275 360 275 425" class="lineProd"/><path d="M1050 295 C1050 355 725 360 725 425" class="lineDev"/><path d="M1250 295 C1250 350 1175 370 1175 425" class="lineDev"/><path d="M275 495 C275 570 290 585 290 650" class="lineProd"/><path d="M725 495 C725 570 790 585 790 650" class="lineDev"/><path d="M1175 495 C1175 535 1518 535 1518 640" class="lineDev"/>
  <text x="1320" y="1305" class="tiny">構成変更時は system-architecture.svg とタスクリストを同時更新する</text>
</svg>
