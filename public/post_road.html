<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>道情報の投稿</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #111111;
        --muted: #666666;
        --line: #d9d9d9;
        --primary: #0066ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
      }

      .page {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 16px 108px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 1.7rem;
      }

      h2 {
        margin: 20px 0 10px;
        font-size: 1rem;
      }

      .tag-panel {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #f5f5f5;
        padding: 10px;
      }

      .tag-search {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 1rem;
        background: #fff;
      }

      .tag-selected {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
        min-height: 38px;
      }

      .tag-selected-empty {
        color: var(--muted);
        font-size: 0.9rem;
        display: flex;
        align-items: center;
      }

      .tag-item {
        border: 1px solid #666;
        background: #fff;
        border-radius: 999px;
        padding: 4px 10px;
        white-space: nowrap;
        font-size: 0.95rem;
        line-height: 1.25;
      }

      .tag-list {
        margin-top: 10px;
        border: 1px solid #aaa;
        border-radius: 8px;
        background: #fff;
        max-height: 130px;
        overflow-y: auto;
      }

      .tag-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid #eee;
      }

      .tag-option:last-child {
        border-bottom: 0;
      }

      .tag-option input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin: 0;
      }

      .tag-option label {
        cursor: pointer;
        font-size: 1.05rem;
        font-weight: 600;
      }

      .tag-list-empty {
        padding: 12px;
        color: var(--muted);
      }

      .detail-input {
        width: 100%;
        min-height: 130px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        font-size: 1rem;
      }

      .upload-row {
        display: grid;
        grid-template-columns: 1fr 160px;
        gap: 12px;
      }

      .preview {
        border: 1px dashed var(--line);
        border-radius: 12px;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        background: #fafafa;
      }

      .upload-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        font-size: 0.95rem;
        background: #fff;
        color: var(--text);
      }

      .not-ready {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .actions {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: min(900px, 100%);
        margin-top: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.98);
        border-top: 1px solid var(--line);
        z-index: 1000;
      }

      .submit {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      @media (max-width: 640px) {
        .upload-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>道情報の投稿</h1>

      <h2>タグ</h2>
      <section class="tag-panel" aria-label="タグ選択">
        <input id="tag-search" class="tag-search" type="text" placeholder="検索..." />
        <div id="tag-selected" class="tag-selected"></div>
        <div id="tag-list" class="tag-list"></div>
      </section>

      <h2>詳細</h2>
      <textarea class="detail-input" placeholder="ここにテキストを入力..."></textarea>

      <h2>画像アップロード</h2>
      <div class="upload-row">
        <div class="preview">選択された画像がここに表示されます</div>
        <div class="upload-buttons">
          <button type="button" class="not-ready" aria-disabled="true">写真ライブラリ</button>
          <button type="button" class="not-ready" aria-disabled="true">カメラで撮影</button>
        </div>
      </div>

      <div class="actions">
        <button id="back-button" type="button">戻る</button>
        <button type="button" class="submit not-ready" aria-disabled="true">投稿</button>
      </div>
    </main>
    <script>
      const fallbackTags = [
        { id: "step", label: "段差" },
        { id: "construction", label: "工事中" },
        { id: "tactile", label: "点字ブロック" },
        { id: "slope", label: "スロープあり" },
        { id: "caution", label: "通行注意" },
        { id: "rough_surface", label: "路面が悪い" },
        { id: "crowded", label: "混雑" },
        { id: "dark_at_night", label: "夜間暗い" }
      ];
      const tagSearchEl = document.getElementById("tag-search");
      const tagSelectedEl = document.getElementById("tag-selected");
      const tagListEl = document.getElementById("tag-list");
      const backButton = document.getElementById("back-button");
      let allTags = [];
      const selectedTagIds = new Set();

      function escapeHtml(text) {
        return text
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function normalizeTags(rawTags) {
        return rawTags
          .map((tag, index) => {
            if (!tag || typeof tag !== "object") {
              return null;
            }
            const id = typeof tag.id === "string" && tag.id.trim() ? tag.id.trim() : `tag_${index}`;
            const label = typeof tag.label === "string" ? tag.label.trim() : "";
            if (!label) {
              return null;
            }
            return { id, label };
          })
          .filter(Boolean);
      }

      function getVisibleTags() {
        const query = tagSearchEl ? tagSearchEl.value.trim().toLowerCase() : "";
        const filtered = query
          ? allTags.filter((tag) => tag.label.toLowerCase().includes(query))
          : allTags.slice();

        filtered.sort((a, b) => {
          const aSelected = selectedTagIds.has(a.id);
          const bSelected = selectedTagIds.has(b.id);
          if (aSelected && !bSelected) return -1;
          if (!aSelected && bSelected) return 1;
          return a.label.localeCompare(b.label, "ja");
        });
        return filtered;
      }

      function renderSelectedTags() {
        if (!tagSelectedEl) {
          return;
        }
        const selectedTags = allTags.filter((tag) => selectedTagIds.has(tag.id));
        if (selectedTags.length === 0) {
          tagSelectedEl.innerHTML = '<div class="tag-selected-empty">未選択</div>';
          return;
        }
        tagSelectedEl.innerHTML = selectedTags
          .map((tag) => `<button type="button" class="tag-item" data-remove-tag-id="${escapeHtml(tag.id)}">${escapeHtml(tag.label)} ×</button>`)
          .join("");
      }

      function renderTagList() {
        if (!tagListEl) {
          return;
        }
        const visibleTags = getVisibleTags();
        if (visibleTags.length === 0) {
          tagListEl.innerHTML = '<div class="tag-list-empty">一致するタグがありません</div>';
          return;
        }
        tagListEl.innerHTML = visibleTags
          .map((tag) => {
            const checked = selectedTagIds.has(tag.id) ? "checked" : "";
            const inputId = `tag-option-${tag.id}`;
            return `<div class="tag-option"><input type="checkbox" id="${escapeHtml(inputId)}" data-tag-id="${escapeHtml(tag.id)}" ${checked}><label for="${escapeHtml(inputId)}">${escapeHtml(tag.label)}</label></div>`;
          })
          .join("");
      }

      function renderTagUi() {
        renderSelectedTags();
        renderTagList();
      }

      fetch("/api/post-tags")
        .then((res) => {
          if (!res.ok) {
            throw new Error("tags_fetch_failed");
          }
          return res.json();
        })
        .then((payload) => {
          const tags = normalizeTags(Array.isArray(payload && payload.tags) ? payload.tags : []);
          allTags = tags.length > 0 ? tags : fallbackTags;
          renderTagUi();
        })
        .catch(() => {
          allTags = fallbackTags;
          renderTagUi();
        });

      if (tagSearchEl) {
        tagSearchEl.addEventListener("input", () => {
          renderTagList();
        });
      }

      if (tagListEl) {
        tagListEl.addEventListener("change", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLInputElement) || target.type !== "checkbox") {
            return;
          }
          const tagId = target.getAttribute("data-tag-id");
          if (!tagId) {
            return;
          }
          if (target.checked) {
            selectedTagIds.add(tagId);
          } else {
            selectedTagIds.delete(tagId);
          }
          renderTagUi();
        });
      }

      if (tagSelectedEl) {
        tagSelectedEl.addEventListener("click", (event) => {
          const target = event.target;
          if (!(target instanceof HTMLElement)) {
            return;
          }
          const removeTagId = target.getAttribute("data-remove-tag-id");
          if (!removeTagId) {
            return;
          }
          selectedTagIds.delete(removeTagId);
          renderTagUi();
        });
      }

      if (backButton) {
        backButton.addEventListener("click", () => {
          window.history.back();
        });
      }
    </script>
  </body>
</html>
