<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ログイン | Draggable Map</title>
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/auth/auth.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="login-title">
        <h1 id="login-title">ログイン</h1>
        <p class="auth-subtitle">Draggable Map を利用するためのログイン画面です。</p>

        <form id="login-form" novalidate>
          <div class="form-row">
            <label for="login-email">メールアドレス</label>
            <input id="login-email" name="email" type="email" autocomplete="email" />
          </div>
          <div class="form-row">
            <label for="login-password">パスワード</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
            />
          </div>
          <div class="actions">
            <button class="btn btn-primary" id="login-button" type="submit">ログイン</button>
            <div id="google-signin-button" class="google-signin-button"></div>
            <a class="btn btn-outline" href="/auth/signup.html">サインアップ画面へ</a>
            <a class="btn btn-debug" href="/map/Index.html?debug=1">Draggable Map へ（デバッグ）</a>
          </div>
        </form>
        <p id="google-auth-status" class="helper-text"></p>
        <p class="helper-text">メール/パスワードログインは未実装です。Googleログインを使ってください。</p>
      </section>
      <footer class="version-footer">
        <span id="app-version">v1.15.0</span>
      </footer>
    </main>

    <script src="/auth/auth.js?v=20260228"></script>
    <script src="/version.js"></script>
    <script src="/pwa.js"></script>
  </body>
</html>
