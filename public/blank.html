<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>道情報の投稿</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #111111;
        --muted: #666666;
        --line: #d9d9d9;
        --primary: #0066ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
      }

      .page {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 16px 28px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 1.7rem;
      }

      h2 {
        margin: 20px 0 10px;
        font-size: 1rem;
      }

      .tag-scroll {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 6px 2px 8px;
        scrollbar-width: thin;
      }

      .tag-item {
        border: 1px solid var(--line);
        background: #f7f7f7;
        border-radius: 999px;
        padding: 8px 14px;
        white-space: nowrap;
        font-size: 0.95rem;
      }

      .detail-input {
        width: 100%;
        min-height: 130px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        font-size: 1rem;
      }

      .upload-row {
        display: grid;
        grid-template-columns: 1fr 160px;
        gap: 12px;
      }

      .preview {
        border: 1px dashed var(--line);
        border-radius: 12px;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        background: #fafafa;
      }

      .upload-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        font-size: 0.95rem;
        background: #fff;
        color: var(--text);
      }

      .not-ready {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .actions {
        margin-top: 24px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .submit {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      @media (max-width: 640px) {
        .upload-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>道情報の投稿</h1>

      <h2>タグ</h2>
      <div class="tag-scroll" aria-label="タグ選択">
        <button type="button" class="tag-item">段差</button>
        <button type="button" class="tag-item">工事中</button>
        <button type="button" class="tag-item">点字ブロック</button>
        <button type="button" class="tag-item">スロープあり</button>
        <button type="button" class="tag-item">通行注意</button>
        <button type="button" class="tag-item">路面が悪い</button>
        <button type="button" class="tag-item">混雑</button>
        <button type="button" class="tag-item">夜間暗い</button>
      </div>

      <h2>詳細</h2>
      <textarea class="detail-input" placeholder="ここにテキストを入力..."></textarea>

      <h2>画像アップロード</h2>
      <div class="upload-row">
        <div class="preview">選択された画像がここに表示されます</div>
        <div class="upload-buttons">
          <button type="button" class="not-ready" aria-disabled="true">写真ライブラリ</button>
          <button type="button" class="not-ready" aria-disabled="true">カメラで撮影</button>
        </div>
      </div>

      <div class="actions">
        <button id="back-button" type="button">戻る</button>
        <button type="button" class="submit not-ready" aria-disabled="true">投稿</button>
      </div>
    </main>
    <script>
      const backButton = document.getElementById("back-button");
      if (backButton) {
        backButton.addEventListener("click", () => {
          window.history.back();
        });
      }
    </script>
  </body>
</html>
