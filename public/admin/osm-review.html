<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StepBy OSM公開確認</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="osm-review.css"></head>
<body><header><h1>OSM公開確認</h1><p>航空写真と記録経路を確認し、公開する記録だけを承認します。</p></header>
<main><section id="login"><h2>管理者ログイン</h2><div id="google-button"></div><p id="login-status"></p></section>
<section id="app" hidden><div class="toolbar"><input id="query" type="search" placeholder="記録者・記録IDを検索"><select id="source"><option value="all">新規・既存すべて</option><option value="new_record">新規記録</option><option value="legacy_record">既存記録</option></select><select id="status"><option value="pending">確認待ち</option><option value="held">保留</option><option value="approved">承認済み</option><option value="rejected">却下</option><option value="merge_failed">送信失敗</option><option value="merged">OSM公開済み</option><option value="all">すべて</option></select><label>開始<input id="from" type="date"></label><label>終了<input id="to" type="date"></label><button id="reload">検索・更新</button><button id="retry-notifications">通知再試行</button><strong id="result-count" aria-live="polite"></strong></div><div class="layout"><aside id="list"></aside><article><div class="map-grid"><section><h3>航空写真</h3><div id="map"></div></section><section><h3>OpenStreetMap</h3><div id="osm-map"></div></section></div><div id="detail"><p>左の記録を選択してください。</p></div></article></div></section></main>
<script src="https://accounts.google.com/gsi/client" async defer></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="osm-review.js"></script></body></html>
