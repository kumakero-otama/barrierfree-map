<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StepBy 開発DB管理</title><link rel="stylesheet" href="database.css"><style>.preview-map{display:block;width:100%;margin-top:14px;border:1px solid #c8d7dc;border-radius:12px}select{display:block;width:100%;margin:6px 0 12px;padding:10px;border:1px solid #a9bec3;border-radius:8px;background:#fff;font:inherit}</style></head><body><main>
<header><p class="badge">UI10・開発DB限定</p><h1>開発データベース確認</h1><p>管理画面とAPIを同じドメイン内で安全に接続します。本番DBとOSMには接続しません。</p></header>
<section class="card"><h2>管理者確認</h2><label>開発管理者キー<input id="admin-key" type="password" autocomplete="off" placeholder="この画面内だけで使用"></label><button id="load-overview" type="button">開発DBを読み込む</button><p id="status" role="status">未読込</p></section>
<section id="overview" class="card hidden"><h2>DB概要</h2><div id="database-summary"></div><div id="table-cards" class="table-cards"></div></section>
<section id="replay" class="card hidden"><h2>保存済みGPSのフィッティング再検証</h2><p>保存済みGPS生データで、現在のブラウザ版ロジックとValhalla版を再計算します。OSMには送信しません。</p><label>記録を選択<select id="replay-session"></select></label><button id="run-replay" type="button">選択した記録を再検証</button> <button id="run-all-replays" type="button">全記録を順番に再検証</button><div id="replay-result"></div></section>
<section id="route-test" class="card hidden"><h2>本番READ ONLYコピー：GPS再生とOSM未送信変更案</h2><p>同じ線記録で、1-2の時刻順GPS再生と、2-1のWay分割・タグ変更案を確認します。</p><label>コピー済み記録<select id="imported-session"></select></label><button id="run-gps-replay" type="button">1-2 GPSを時刻順に再生</button> <button id="create-osm-preview" type="button">2-1 OSM未送信変更案を作る</button><div id="route-test-result"></div><svg id="osm-preview-map" class="preview-map hidden" viewBox="0 0 800 360" role="img" aria-label="OSM変更案の経路図"></svg><div id="osm-preview-operations"></div></section>
<section id="table-view" class="card hidden"><div class="section-heading"><h2 id="table-title">テーブル内容</h2><button id="close-table" type="button">閉じる</button></div><p class="warning">GPS座標を含む場合があります。第三者へ共有しないでください。</p><div class="table-wrap"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div></section>
<section id="experiment" class="card hidden"><h2>API作成・削除実験</h2><label>ラベル<input id="experiment-label" value="管理画面からの開発DB試験"></label><label>JSONデータ<textarea id="experiment-payload" rows="5">{"test":true,"source":"dev admin","osmSent":false}</textarea></label><button id="create-experiment" type="button">開発DBへ試験データを作成</button><div id="experiment-result"></div></section>
</main><script src="database.js"></script></body></html>
