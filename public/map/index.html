<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draggable Map</title>
    <meta name="theme-color" content="#222222" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="map.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Draggable Map</h1>
      <div class="map-row">
        <div id="map" aria-label="Map"></div>
        <aside class="map-side">
          <div class="meta">
            <div id="last-updated">Last update: --:--:--</div>
            <div class="record-toggle" role="group" aria-label="Record toggle">
              <span class="record-title">点字ブロック記録:</span>
              <span class="record-label">OFF</span>
              <label class="switch">
                <input id="toggle-record" type="checkbox" aria-label="Record" />
                <span class="slider"></span>
              </label>
              <span class="record-label">ON</span>
            </div>
            <div class="record-toggle" role="group" aria-label="Show all records toggle">
              <span class="record-title">点字ブロック表示:</span>
              <span class="record-label">OFF</span>
              <label class="switch">
                <input id="toggle-show-all" type="checkbox" aria-label="Show All Records" />
                <span class="slider"></span>
              </label>
              <span class="record-label">ON</span>
            </div>
            <div class="record-toggle" role="group" aria-label="現在地の中央表示 toggle">
              <span class="record-title">現在地の中央表示:</span>
              <span class="record-label">OFF</span>
              <label class="switch">
                <input
                  id="toggle-center-current"
                  type="checkbox"
                  aria-label="現在地の中央表示"
                  checked
                />
                <span class="slider"></span>
              </label>
              <span class="record-label">ON</span>
            </div>
          </div>
        </aside>
      </div>
      <div class="assist-action">
        <a class="assist-btn" href="/otasuke.html" aria-label="お助け投稿">
          <img src="/assets/buttons/otasuke.png" alt="お助け投稿" />
        </a>
      </div>
      <p id="coords">Lat: --, Lng: --</p>
      <p id="raw-coords">Raw: --, --</p>
      <p><a class="btn" href="../index.html">Back</a></p>
      <footer class="version-footer">
        <span id="app-version">v1.8.0</span>
      </footer>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="map.js"></script>
    <script src="/version.js"></script>
    <script src="/pwa.js"></script>
  </body>
</html>
